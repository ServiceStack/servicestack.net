name: Build

permissions:
  contents: write

on:
  push:
    branches:
      - 'main'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: Validate security reporting sources
        run: python3 scripts/check_security.py

      - name: Test S3 routing-rule synchronization
        run: python3 -m unittest discover -s scripts -p 'test_sync_s3_redirects.py'

      - name: setup .net
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: build
        working-directory: ./MyApp
        run: |
          dotnet --info
          dotnet build -c Release

      - name: Assign default GitHub URL base path
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          custom_domain=$(gh api "/repos/${{ github.repository }}/pages" | jq -r '.cname // empty')
          echo "CNAME config detected: $custom_domain"
          repo_name=$(echo ${{ github.repository }} | cut -d '/' -f 2)
          org_name=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')
          if [ ! -f "./MyApp/wwwroot/CNAME" ] && [ ! custom_domain ] 
          then
            echo "ssg_base_href=$(echo https://$org_name.github.io/$repo_name/)" >> $GITHUB_ENV
          else
            if [ custom_domain ]
            then
              # Persist CNAME settings
              echo "$custom_domain" > ./MyApp/wwwroot/CNAME
            fi
          fi

      - name: Install tailwindcss
        run: |
          mkdir -p /home/runner/.local/bin
          curl -o "/home/runner/.local/bin/tailwindcss" -L "https://github.com/tailwindlabs/tailwindcss/releases/latest/download/tailwindcss-linux-x64"
          chmod +x /home/runner/.local/bin/tailwindcss

      - name: Build tailwind
        working-directory: ./MyApp
        run: |
          npm run build

      - name: prerender
        working-directory: ./MyApp
        env:
          ASPNETCORE_ENVIRONMENT: Production
          DOTNET_ENVIRONMENT: Production
        run: |
          site_base_href=${{ env.ssg_base_href }}
          if [ ! -z "$site_base_href" ]
          then
            echo "Prerendering for deployment to $site_base_href"
            dotnet run -c Release --no-launch-profile --AppTasks=prerender --BaseHref "$site_base_href"
          else
            echo "Prerendering for deployment to $custom_domain"
            dotnet run -c Release --no-launch-profile --AppTasks=prerender --BaseUrl "$site_base_url"
          fi


      - name: Validate generated security reporting pages
        run: python3 scripts/check_security.py --dist MyApp/dist

      # Deploy UI to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./MyApp/dist
          user_name: 'GitHub Action'
          user_email: 'action@github.com'
          
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          
      - name: Push to S3 prod
        working-directory: ./MyApp
        run: |
          aws s3 sync ./dist/ s3://servicestack.net/
          # Set explicit metadata even when an unchanged file was skipped by sync.
          aws s3 cp ./dist/.well-known/security.txt s3://servicestack.net/.well-known/security.txt \
            --content-type 'text/plain; charset=utf-8' --cache-control 'public, max-age=3600'
          
      - name: Apply S3 website routing rules
        run: python3 scripts/sync_s3_redirects.py --bucket servicestack.net --rules MyApp/wwwroot/s3-redirects.json

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id E3770UUEKTY40O --paths "/*"

      - name: Validate deployed security reporting endpoints
        run: python3 scripts/check_security.py --live https://servicestack.net --attempts 12 --delay 15
